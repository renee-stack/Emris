# places/il/chicago.yaml
# Loaded by `python -m pipeline.run il-chicago`. Schema: places/_schema.py, docs/contract.md section 1.
# Data findings behind each choice: places/il/AUDIT.md.

place_id: il-chicago
name: Chicago
state: IL
county_fips: "17031"
census_place: "1714000"
peer_group: cbsa:16980            # Chicago-Naperville-Elgin metro; percentile group
coverage_tier: parcel
proximity_decay_mi: [0.25, 1.0]   # full weight inside 0.25 mi, zero at 1 mi

sources:
  permits:
    connector: socrata
    domain: data.cityofchicago.org
    dataset: ydr8-5enu
    since_months: 24
    fields:
      permit_id: permit_
      issued: issue_date
      status: permit_status
      permit_type: permit_type
      work_type: work_type
      text: work_description
      cost: reported_cost
      parcel_ids: pin_list          # 10-digit, several joined with " | "
      lat: latitude
      lng: longitude
      address: [street_number, street_direction, street_name]
      tract_hint: census_tract
    parcel_id_format: { separator: "|", pad_right: "0000", length: 14 }
    normalize_dashes: true          # Express Program label uses an en dash
    units:
      # 94% filled on new construction since 2024, always null before (AUDIT.md section 1).
      # 0 is real (garages, caisson/foundation-only phases); text is used only when null.
      field: residential_unit_change
      from_text: { hook: custom.units_from_text.parse_units }   # port of the hackathon parser
    classes:
      new_mf:
        permit_type: "PERMIT - NEW CONSTRUCTION"
        min_units: 5
      alteration:
        permit_type: "PERMIT - RENOVATION/ALTERATION"
      demolition:
        permit_type: "PERMIT - WRECKING/DEMOLITION"
      roof:
        permit_type: "PERMIT - EXPRESS PERMIT PROGRAM"
        work_type: ["Reroofing"]
      major_mep:
        any_of:
          - permit_type: "PERMIT - EXPRESS PERMIT PROGRAM"
            work_type: ["Electrical Work", "Plumbing Work", "Mechanical Work"]
            min_cost: 25000          # starting floor; tune after reviewing results
          - permit_type: "PERMIT - ELEVATOR EQUIPMENT"
      other: { default: true }
    record_url: "https://data.cityofchicago.org/resource/ydr8-5enu.json?permit_={permit_}"

  parcels:
    - name: residential_under_7_units
      connector: socrata
      domain: datacatalog.cookcountyil.gov
      dataset: x54s-btds
      latest_year_only: true          # one row per parcel per year, every year
      # Assessor township codes inside the city. Only narrows the download; membership
      # comes from the locations source below.
      filter: { township_code: ["70", "71", "72", "73", "74", "75", "76", "77"] }
      fields:
        parcel_id: pin
        year: year
        year_built: char_yrblt
        land_use: class
        units: char_apts
      # Words, not numbers. "None" = no extra apartments, i.e. a single-family house.
      value_maps:
        units: { "None": 1, "Two": 2, "Three": 3, "Four": 4, "Five": 5, "Six": 6 }
      aggregate: { units: sum, year_built: min }   # one row per building card
    - name: commercial_incl_7plus_apartments
      connector: socrata
      domain: datacatalog.cookcountyil.gov
      dataset: csik-bsws
      latest_year_only: true
      years_back: 3                  # lists only parcels reassessed that year (3-year cycle)
      parcel_id_format: { strip: "-", length: 14 }
      fields:
        parcel_id: keypin            # dashed: 20-03-111-016-0000
        year: year
        address: address
        land_use: class_es
        units: tot_units
        year_built: yearbuilt        # text like "1908.0"; 99.9% filled for 7+ units (AUDIT.md section 2)
    - name: locations
      connector: socrata
      domain: datacatalog.cookcountyil.gov
      dataset: pabr-t5kh
      role: geometry
      fields: { parcel_id: pin, lat: lat, lng: lon }
      # Source column: Census place of the parcel. 881,574 parcels, all CITY OF CHICAGO.
      filter: { census_place_geoid: "1714000" }

  catalysts:
    connector: firecrawl
    urls: []                         # to add: transit agency projects, city capital plan, local news
    seed_file: legacy/data/infrastructure.json   # hackathon Firecrawl list, loaded as curated
