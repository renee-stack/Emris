# The only public app. REDLINE_API_KEY and any Stripe values are Fly secrets, not set here.
# Deploy from the repo root, the build context:
#   fly deploy --config deploy/fly/api.toml --dockerfile deploy/Dockerfile --ha=false
# The model runs on Vertex AI, so Fly needs Google Cloud credentials: a service account key as a Fly secret,
# written to a file at boot and named in GOOGLE_APPLICATION_CREDENTIALS. The Google Cloud VM needs none of that.

app = "redline-api"
primary_region = "iad"

[env]
  REDLINE_HOST = "::"
  DEMO_PORT = "8792"
  VERTEX_REGION = "global"

[[mounts]]
  source = "redline_api_data"
  destination = "/data"

[http_service]
  internal_port = 8792
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
