name: guardrails

on:
  push:
  pull_request:

jobs:
  place-names:
    name: No place names in code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check_place_names.sh

  place-configs:
    name: Place configs validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.validate
